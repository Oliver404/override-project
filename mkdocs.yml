site_name: Override Project
site_description: Landing page and documentation for the Override Project
site_author: Oliver 404
site_url: https://oliver404.github.io/override-project/
repo_url: https://github.com/Oliver404/override-project
copyright: "© Oliver 404"

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.top
    - navigation.expand
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - search.suggest
  language: en

plugins:
  - search:
      lang: ['en', 'es']
  - i18n:
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: es
          name: Español
          build: true
      nav_translations:
        es:
          'Getting started': 'Empezando'
          'Features': 'Características'
  - blog
nav:
  - 'Home': 'index.md'
  - 'Documentation':
    - 'Getting started': 'getting-started.md'
    - 'Features': 'features-test.md'
    - 'Development': 'development.md'
    - 'Contributing': 'contributing.md'
    - 'Changelog': 'changelog.md'
  - 'Blog': 'blog/index.md'

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - attr_list
  - def_list

docs_dir: docs
site_dir: site

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Oliver404/override-project
  repo_url: https://github.com/Oliver404/override-project

extra_css:
  - styles/overrides.css

extra_javascript:
  - javascripts/extra.js

strict: false
